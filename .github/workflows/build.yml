# ShiwakeFiler の exe を自動で作る設定
#  - Release を公開すると、Windows で exe を作って ShiwakeFiler.zip として添付
#  - Actions タブの「Run workflow」で手動テストも可（Artifacts から ZIP を取得）
name: Build exe

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller -r requirements.txt

      - name: Build
        run: python -m PyInstaller --noconfirm --clean --windowed --name ShiwakeFiler --collect-all av shiwake_filer.py

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist/ShiwakeFiler -DestinationPath ShiwakeFiler.zip

      - name: Upload artifact (manual run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ShiwakeFiler
          path: ShiwakeFiler.zip

      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" ShiwakeFiler.zip --clobber
